# web 容器的站配置（挂到 /etc/nginx/conf.d/default.conf，替换掉镜像自带的那个）。
#
# 两件事：托管 SPA 静态文件 + 把 /api 反代给同网络的 api 容器。
#
# 为什么 /api 必须同源反代，而不是让前端直接请求 api 容器的 IP：
#   apps/web 里所有后端调用都是**相对路径**（/api/openhex/token 等，见
#   features/assistant/openhex.ts），从来就是按「同源」设计的。同源还顺手免掉了 CORS ——
#   后端刻意没写 CORS 中间件，跨域方案会把它推翻。
#
# ⚠️ 前端的聊天 SSE **不经过这里**：SDK 直接连 https://api.openhex.tech（浏览器自己发）。
#    所以这里不需要 proxy_buffering off / SSE 相关配置。

server {
  # 两个栈都显式写。官方镜像的入口脚本本来会自动补 `listen [::]:80;`，
  # 而下面 Dockerfile 刻意绕过了那个入口（见那里的注释），所以这里自己写全 ——
  # 否则容器内只有 IPv4，某些走 IPv6 的转发会连不上。
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 镜像自带的 nginx.conf 里 gzip 是注释掉的，得在这里开
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # 对话镜像整段覆盖写的上限是 1MB（apps/api/src/index.ts 的 readJsonBody(req, 1MB)），
  # 而 nginx 默认 client_max_body_size 恰好也是 1m —— 正好卡在边界上，
  # 超一点就会被 nginx 用一段 HTML 413 拦掉，看不到后端那句带原因的 JSON 错误。
  # 放到 4m，把这个判断交给后端，错误信息才是人话。
  client_max_body_size 4m;

  # Vite 产物带内容哈希，可以放心长缓存
  location /assets/ {
    # 只写**一条** Cache-Control。`expires 1y` 与 `add_header Cache-Control` 并用会发出
    # 两个 Cache-Control 头（实测踩到：`max-age=31536000` 和 `public, immutable` 各一条）。
    # 浏览器会合并，但中间代理 / CDN 遇到重复头的行为就没保证了 —— 这里显式合成一条。
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/ {
    # 结尾**不带** URI 部分：/api/openhex/token 原样透传（后端路由前缀就是 /api/）。
    # 一旦写成 proxy_pass http://api:8000/ ，末尾的斜杠会把 /api 前缀吃掉，全部 404。
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 令牌签发要打平台接口，默认 60s 略紧
    proxy_read_timeout 120s;
  }

  # ⚠️ index.html 必须每次回源校验（no-cache = 可以缓存，但用之前必须问一次，
  #    不是 no-store）。它**不参与构建哈希**，是整个产物里唯一「不带版本号」的文件，
  #    因此它是指向当前版本产物的唯一指针 —— 一旦被浏览器启发式缓存住，
  #    服务器换了新产物、手机还在用旧 index.html，就会去请求**已经不存在**的旧 chunk，
  #    现象是白屏或继续跑旧代码。实测踩到过：修复版部署后手机上仍报同一个错，
  #    原因就是这一层没写。
  #    带哈希的 /assets/* 反过来要长缓存（见下），两者是一对，不能只做一半。
  #
  #    放在 `location /` 前面：`try_files` 回退到 /index.html 时 nginx 会重新匹配
  #    location，正好落到这条上，所以 SPA 深链也拿得到这个头。
  #    有了 ETag/Last-Modified，校验命中就是一次 304，几乎不花带宽。
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA 是 history 路由（createBrowserRouter），/chat 这种深链在服务器上并不存在对应文件，
  # 必须回退到 index.html 交给前端路由，否则刷新即 404。
  location / {
    try_files $uri $uri/ /index.html;
  }
}
